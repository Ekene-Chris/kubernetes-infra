# Template for creating ACR pull secret
# Create this secret in each namespace where you deploy services
#
# To create the secret, run:
# kubectl create secret docker-registry acr-secret \
#   --docker-server=teleiosacr.azurecr.io \
#   --docker-username=<ACR_USERNAME> \
#   --docker-password=<ACR_PASSWORD> \
#   --namespace=rideshare-dev
#
# Repeat for each namespace: rideshare-dev, rideshare-staging, rideshare-prod
#
# Alternatively, use Azure Workload Identity or Managed Identity for AKS to pull from ACR

---
apiVersion: v1
kind: Secret
metadata:
  name: acr-secret
  namespace: rideshare-dev  # Change for each environment
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64-encoded-docker-config>

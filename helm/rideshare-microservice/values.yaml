# Default values for rideshare microservices
# This file provides defaults that can be overridden by service-specific and environment-specific values

# Service metadata
name: ""
namespace: rideshare

# Image configuration
image:
  registry: teleiosacr.azurecr.io
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: acr-secret

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Deployment configuration
replicaCount: 2

# Resource limits
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Health checks
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Environment variables from ConfigMap
config:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"

# Sensitive environment variables from Secret
secrets:
  DATABASE_URL: ""
  REDIS_URL: ""

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Autoscaling configuration (optional)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Service account
serviceAccount:
  create: false
  name: ""

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

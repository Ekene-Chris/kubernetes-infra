# Service-specific values for rideshare-driver-service
name: rideshare-driver-service
namespace: rideshare

image:
  repository: rideshare-driver-service
  tag: "latest"

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

replicaCount: 2

# Configuration specific to driver service
config:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  SERVICE_NAME: "rideshare-driver-service"
  # Inter-service communication
  RIDER_SERVICE_URL: "http://rideshare-rider-service.rideshare.svc.cluster.local"
  EMAIL_SERVICE_URL: "http://rideshare-email-service.rideshare.svc.cluster.local"

# Secrets - these will be overridden by environment-specific values
secrets:
  DATABASE_URL: ""
  REDIS_URL: ""

# Ingress - can be enabled per environment
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: driver-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: driver-api-tls
      hosts:
        - driver-api.example.com

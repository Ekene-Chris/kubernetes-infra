# Common values for all services in development environment
namespace: rideshare-dev

image:
  tag: "dev-latest"
  pullPolicy: Always

replicaCount: 1

# Development resource limits (lower for cost savings)
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "250m"

# Development configuration
config:
  NODE_ENV: "development"
  LOG_LEVEL: "debug"

# Secrets - These should be managed via external secrets or sealed secrets in production
secrets:
  DATABASE_URL: "postgresql://dev-user:dev-password@postgres.rideshare-dev.svc.cluster.local:5432/rideshare_dev"
  REDIS_URL: "redis://redis.rideshare-dev.svc.cluster.local:6379"

# Ingress settings for dev
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  # Update hosts based on your dev domain
  tls: []

# Disable autoscaling in dev
autoscaling:
  enabled: false
